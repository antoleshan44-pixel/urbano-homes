server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urbano_homes}
    username: ${DB_USER:urbano}
    password: ${DB_PASSWORD:urbano_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:default-secret-change-in-production}
  access-expiry: 900
  refresh-expiry: 604800
  issuer: urbano-homes

africatalking:
  username: ${AT_USERNAME}
  api-key: ${AT_API_KEY}
  sender-id: UrbanoHomes
  enabled: ${AT_ENABLED:true}

logging:
  level:
    com.urbano: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
