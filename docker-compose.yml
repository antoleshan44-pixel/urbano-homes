version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: urbano-postgres
    environment:
      POSTGRES_DB: urbano_homes
      POSTGRES_USER: urbano
      POSTGRES_PASSWORD: urbano_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbano"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urbano-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: