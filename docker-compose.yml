services:
  postgres:
    image: postgres:16
    container_name: urbano-postgres
    environment:
      POSTGRES_DB: urbano_homes
      POSTGRES_USER: urbano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbano_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbano"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urbano-network

  redis:
    image: redis:7-alpine
    container_name: urbano-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urbano-network

  minio:
    image: minio/minio:latest
    container_name: urbano-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urbano-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: urbano-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-default-secret-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:8081
      PROPERTY_SERVICE_URL: http://property-service:8082
      LISTING_SERVICE_URL: http://listing-service:8083
      TENANT_SERVICE_URL: http://tenant-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8086
      CRM_SERVICE_URL: http://crm-service:8087
    ports:
      - "8090:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - urbano-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: urbano-auth
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-urbano_dev_password}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-default-secret-change-in-production}
    ports:
      - "8091:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urbano-network

  property-service:
    build:
      context: ./services/property-service
      dockerfile: Dockerfile
    container_name: urbano-property
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-urbano_dev_password}
      REDIS_HOST: redis
    ports:
      - "8092:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urbano-network

  listing-service:
    build:
      context: ./services/listing-service
      dockerfile: Dockerfile
    container_name: urbano-listing
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
    ports:
      - "8093:8083"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - urbano-network

  tenant-service:
    build:
      context: ./services/tenant-service
      dockerfile: Dockerfile
    container_name: urbano-tenant
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-urbano_dev_password}
      REDIS_HOST: redis
    ports:
      - "8094:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urbano-network

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: urbano-payment
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-urbano_dev_password}
      REDIS_HOST: redis
    ports:
      - "8095:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urbano-network

  maintenance-service:
    build:
      context: ./services/maintenance-service
      dockerfile: Dockerfile
    container_name: urbano-maintenance
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-urbano_dev_password}
      REDIS_HOST: redis
    ports:
      - "8096:8086"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urbano-network

  crm-service:
    build:
      context: ./services/crm-service
      dockerfile: Dockerfile
    container_name: urbano-crm
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-urbano_dev_password}
      REDIS_HOST: redis
    ports:
      - "8097:8087"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urbano-network

  # ===========================================================================
  # NEW SERVICES
  # ===========================================================================

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: urbano-notification
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-urbano_dev_password}
      REDIS_HOST: redis
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
    ports:
      - "8098:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urbano-network

  report-service:
    build:
      context: ./services/report-service
      dockerfile: Dockerfile
    container_name: urbano-report
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-urbano_dev_password}
      REDIS_HOST: redis
      REPORT_STORAGE_PATH: ${REPORT_STORAGE_PATH:-/tmp/reports}
    ports:
      - "8099:8089"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urbano-network
    volumes:
      - report_data:/tmp/reports

  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    container_name: urbano-audit
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-urbano_dev_password}
      REDIS_HOST: redis
    ports:
      - "8100:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urbano-network

networks:
  urbano-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  report_data: